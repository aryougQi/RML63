# 所有坐标和长度阈值均使用输入图像像素；不自动缩放。
preprocessing:
  blur_kernel: 5
  canny_low: 50
  canny_high: 150
  close_kernel: 3
  # 可选颜色先验，HSV 范围 H:0..179，S/V:0..255；null 表示不启用。
  hsv_lower: null
  hsv_upper: null
  # 可选搜索区域 [x, y, width, height]，输出仍使用原图坐标。
  roi: null
detection:
  min_area_ratio: 0.015
  max_area_ratio: 0.85
  min_side_px: 25
  min_angle_deg: 25
  max_angle_deg: 155
  border_margin_px: 3
  approx_epsilon_ratios: [0.01, 0.02, 0.035]
  edge_distance_px: 2.5
  min_edge_support: 0.80
  min_side_support: 0.65
  max_unsupported_run_ratio: 0.22
  min_contour_coverage: 0.75
  min_line_support: 0.40
  hough_threshold: 25
  hough_min_line_length: 25
  hough_max_line_gap: 8
  line_angle_tolerance_deg: 12
  line_distance_px: 4
  refine_distance_px: 4
  max_refine_shift_px: 8
  duplicate_distance_px: 12
  ambiguity_score_margin: 0.035
  max_candidates: 100
input_geometry:
  # 截图是否裁剪/缩放未知时保持 unknown。已知时可填写 source_resolution_wh
  # 及 source_to_input_3x3（源相机像素到输入图像像素的齐次变换）。
  status: unknown
  source_resolution_wh: null
  source_to_input_3x3: null

# 可选复杂场景：组合 Hough 直线，不要求篮口内部形成单一闭轮廓。
# 默认关闭，需根据实际边框外观选择先验；见 basket_real.yaml。
