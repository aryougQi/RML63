# Pinned upstream algorithm, same defaults for every image; no HSV or ROI.
# Existing acceptance thresholds are identical to general.yaml.
preprocessing:
  blur_kernel: 5
  canny_low: 50
  canny_high: 150
  close_kernel: 3
  hsv_lower: null
  hsv_upper: null
  roi: null
detection:
  min_area_ratio: 0.015
  max_area_ratio: 0.85
  min_side_px: 25
  min_angle_deg: 25
  max_angle_deg: 155
  border_margin_px: 3
  approx_epsilon_ratios:
  - 0.01
  - 0.02
  - 0.035
  edge_distance_px: 2.5
  min_edge_support: 0.8
  min_side_support: 0.65
  max_unsupported_run_ratio: 0.22
  min_contour_coverage: 0.75
  min_line_support: 0.4
  hough_threshold: 25
  hough_min_line_length: 25
  hough_max_line_gap: 8
  line_angle_tolerance_deg: 12
  line_distance_px: 4
  refine_distance_px: 4
  max_refine_shift_px: 8
  duplicate_distance_px: 12
  ambiguity_score_margin: 0.035
  max_candidates: 1000
  reference_long_side_px: 1000
  opencv_quads:
    enabled: false
    threshold_levels: 11
    canny_high: 50
    max_proposals: 500
    max_examined_contours: 20000
  region_proposals:
    enabled: false
  line_proposals:
    enabled: false
  rim_polarity:
    enabled: false
  docdetect:
    enabled: true
    max_side: 640
    max_proposals: 500
    timeout_seconds: 10
input_geometry:
  status: unknown
  source_resolution_wh: null
  source_to_input_3x3: null
