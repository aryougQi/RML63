# MoveIt controller map for the Gazebo controller spawned by the simulation
# launch.  The upstream file in rml_63_moveit_config points at rm_group,
# which is the real-robot controller name and is deliberately not used here.
controller_list:
  - name: arm/arm_joint_controller
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
